<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MyFeeds{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='icon-192.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icon-192.png') }}">
    <meta name="theme-color" content="#f26522">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
</head>
<body>
    <div class="app">
        <div class="sidebar-overlay"></div>
        {% block content %}{% endblock %}
    </div>
    <div class="filter-sheet-overlay" id="filterSheetOverlay">
        <div class="filter-sheet" id="filterSheet">
            <div class="filter-sheet-header">
                <h3 class="filter-sheet-title">Add to Filter</h3>
                <button type="button" class="filter-sheet-close" id="filterSheetClose" aria-label="Close">&times;</button>
            </div>
            <div class="filter-sheet-body">
                <div class="filter-select-row">
                    <label for="filterSelect">Filter</label>
                    <select id="filterSelect"></select>
                </div>
                <div class="filter-new-form" id="filterNewForm" style="display:none">
                    <input type="text" id="newFilterName" placeholder="Filter name..." class="filter-new-input" maxlength="200">
                    <select id="newFilterTarget">
                        <option value="both">Title &amp; Summary</option>
                        <option value="title">Title only</option>
                        <option value="summary">Summary only</option>
                    </select>
                </div>

                <div class="term-source" id="termSource"></div>
                <div class="term-add-bar">
                    <button type="button" class="btn term-add-btn" id="termAddBtn" disabled>Add</button>
                </div>
                <div class="term-chips-area" id="termChipsArea">
                    <div class="term-chips" id="termChips"></div>
                    <input type="text" class="term-free-input" id="termFreeInput" placeholder="Type a term...">
                </div>
                <div class="term-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="wholeWordToggle"> Whole word
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="pluralToggle"> Single+Plural
                    </label>
                </div>

                <div class="test-preview">
                    <span class="test-badge">PREVIEW</span>
                    <div class="test-result" id="testResult"></div>
                </div>
                <div class="test-match-count" id="testMatchCount"></div>
                <div class="test-pattern-display">
                    <label>Pattern</label>
                    <code id="testPatternDisplay"></code>
                </div>
                <div class="test-error" id="testError" style="display:none"></div>
            </div>
            <div class="filter-sheet-footer" id="filterSheetFooter">
                <button type="button" class="btn" id="testSaveBtn" disabled>Save</button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
    <script src="{{ url_for('static', filename='filter-sheet.js') }}"></script>
</body>
</html>
